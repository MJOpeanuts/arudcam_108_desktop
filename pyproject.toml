[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arducam-capture"
version = "0.1.0"
description = "Application locale de capture pour caméra Arducam 108 MP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20,<2",
    "openpyxl>=3.1.5,<4",
    "pillow>=12.3,<13",
    "pydantic-settings>=2.15,<3",
    "sqlalchemy>=2.1,<3",
    "streamlit>=1.64,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "ruff>=0.16,<1",
]
packaging = ["pyinstaller>=6.22,<7"]

[project.scripts]
arducam-capture = "arducam_capture.launcher.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["arducam_capture.domain", "arducam_capture.application"]

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
